[project]
name = "small-council"
version = "0.1.0"
description = "A heterogeneous, verifier-checked multi-agent coder built on small LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jose Laruta" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-ai-slim[openai]",
    "typer>=0.12",
]

[project.scripts]
council = "small_council.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/small_council"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
